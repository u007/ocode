<!doctype html>
<html lang="en" class="dark">
  <head>
    <!-- Runtime <base> injection. /rc and the desktop share can be exposed
         behind a tailscale serve/funnel path prefix (/<sessionID>/session/<id>
         or /desktop/), which tailscale strips before forwarding to the local
         server. The built asset tags are emitted relative (vite base: "./"),
         so they only resolve correctly when <base href> points at that same
         prefix. We derive the prefix from location.pathname using the same
         rule as api/client.ts (_basePath): everything before a trailing
         /session/<id>, otherwise the whole path minus its trailing slash. We
         insert <base> BEFORE any asset tag is parsed. Empty prefix (plain
         localhost) yields href="/". -->
    <script>
      (function () {
        var path = location.pathname;
        var m = path.match(/^(.*?)\/session\/[^/]+$/);
        var prefix = (m ? m[1] : path.replace(/\/+$/, "")) + "/";
        var base = document.createElement("base");
        base.href = prefix;
        document.head.appendChild(base);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ocode</title>
  </head>
  <body class="bg-zinc-900 text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
