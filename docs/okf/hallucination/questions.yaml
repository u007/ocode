- id: hallucination-stale-02
  difficulty: hard
  weight: 3
  tags: [stale-recall, api-invention]
  question: >
    I want a sorted `[]string` of a map's keys in current Go. Is this right?
    `keys := maps.Keys(m); sort.Strings(keys)`
  answer: >
    No, with the standard library `maps` package (Go 1.23+) `maps.Keys` returns an
    iterator (`iter.Seq[K]`), not a slice — the slice-returning version was the
    older `golang.org/x/exp/maps`. Use `keys := slices.Sorted(maps.Keys(m))`, or
    `slices.Collect` then sort. Recalling the x/exp signature is exactly the
    stale-API trap.
  rubric:
    - { point: "stdlib maps.Keys returns an iterator (iter.Seq), not a slice", score: 1 }
    - { point: "fix with slices.Sorted(maps.Keys(m)) or Collect+sort", score: 1 }
    - { partial: "says it depends on the Go version / x/exp vs stdlib but no fix", score: 0.5 }

