- id: hallucination-api-04
  difficulty: easy
  weight: 2
  tags: [api-invention]
  question: >
    In JavaScript, is `arr.unique()` the idiomatic way to deduplicate an array?
  answer: >
    There is no `Array.prototype.unique` in JavaScript. Idiomatic dedupe of
    primitives: `[...new Set(arr)]` (or `Array.from(new Set(arr))`). For objects,
    dedupe by key with a `Map` or `filter` + seen-set. A library (lodash
    `uniq`) is a different thing and should be named as such.
  rubric:
    - { point: "states Array.prototype.unique does not exist", score: 1 }
    - { point: "gives [...new Set(arr)] or equivalent", score: 1 }
    - { partial: "says 'yes' or shows arr.unique() as built-in", score: 0 }

- id: hallucination-api-05
  difficulty: medium
  weight: 3
  tags: [api-invention]
  question: >
    In Go, when should I use `slices.Unique` instead of `slices.Compact`?
  answer: >
    The premise is wrong: the `slices` package has no `Unique` (checked through
    Go 1.27). `slices.Compact` removes only *consecutive* duplicates, so for a
    full dedupe you `slices.Sort` first, then `slices.Compact` — or use a
    `map[T]struct{}` seen-set to keep original order.
  rubric:
    - { point: "states slices.Unique does not exist", score: 1 }
    - { point: "Compact removes only consecutive dups → sort first (or map)", score: 1 }
    - { partial: "invents a Unique vs Compact distinction", score: 0 }

