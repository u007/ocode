# PowerPoint (.pptx / .ppt) editing benchmark corpus — SOURCE OF TRUTH.
# Format: docs/okf/_schema/question-format.md. Grade with rubric-guide.md.
# corpus_rev must match meta.yaml (1).
# Grade technique, not library: an equivalent correct approach (Open XML SDK,
# raw zip + lxml) earns the point.
# python-pptx facts below were verified on 1.0.2 (2026-09-28).

# ---------------------------------------------------------------- pptx-model

- id: pptx-model-01
  difficulty: easy
  weight: 3
  tags: [pptx-model]
  question: >
    How is a table stored in a .pptx slide, and which XML elements hold its
    columns, rows, cells and text?
  answer: >
    A .pptx is a ZIP of XML parts: each slide is ppt/slides/slideN.xml, linked
    to a layout and master. A table is a p:graphicFrame (position and size in
    p:xfrm) whose a:graphic/a:graphicData holds an a:tbl. The a:tbl contains
    a:tblPr (style id and banding flags), then a:tblGrid with one
    a:gridCol w="…" per column, then one a:tr h="…" per row. Each row has one
    a:tc per grid column, and each a:tc holds an a:txBody (a:p/a:r/a:t) and an
    a:tcPr. A table is not a p:sp shape.
  rubric:
    - { point: "graphicFrame (xfrm) → a:graphic/graphicData → a:tbl", score: 1 }
    - { point: "a:tblGrid/a:gridCol w; a:tr h; a:tc with a:txBody (+ a:tcPr)", score: 1 }

- id: pptx-model-02
  difficulty: medium
  weight: 2
  tags: [pptx-model]
  question: >
    What units does python-pptx / DrawingML use for positions and sizes, and
    what are the slide's dimensions in a default 16:9 deck?
  answer: >
    EMU (English Metric Units): 914400 per inch, 12700 per point, 360000 per
    cm. Shape left, top, width and height, the gridCol widths and the row
    heights are all in EMU. The slide size is prs.slide_width and
    prs.slide_height. A 16:9 deck is typically 12192000 × 6858000 EMU
    (13.333 × 7.5 in). Always read the size from the presentation instead of
    assuming it.
  rubric:
    - { point: "EMU: 914400/inch, 12700/pt", score: 1 }
    - { point: "read prs.slide_width/height (16:9 ≈ 13.333×7.5 in), don't assume", score: 1 }

- id: pptx-model-03
  difficulty: medium
  weight: 2
  tags: [pptx-model, image-replace]
  question: >
    A company logo appears on every slide, but iterating `slide.shapes` on any
    slide does not find it. Where is it, and what are the consequences of
    editing it there?
  answer: >
    It lives on the slide LAYOUT or the slide MASTER (slide.slide_layout.shapes,
    or prs.slide_master.shapes / slide_layouts), which slides inherit. Editing
    it there changes every slide that uses that layout or master. If only one
    slide should change, override it on that slide, and tell the user the
    scope. Slide-level edits do not touch it.
  rubric:
    - { point: "inherited from layout/master, not on the slide", score: 1 }
    - { point: "editing layout/master affects all slides using it; scope decision", score: 1 }

# ---------------------------------------------------------------- table-locate

- id: pptx-locate-01
  difficulty: medium
  weight: 3
  tags: [table-locate]
  question: >
    How do you find the table on slide 3 and the row for "Gadget D" with
    python-pptx?
  answer: >
    Iterate slide.shapes and select shapes with has_table true: these are
    graphic frames, and shape.table gives the table. Group shapes need
    recursion. Pick the table by its header text, not by shape index, then
    find the row whose first cell's text_frame.text, stripped, equals
    "Gadget D". Assert exactly one match. Rows are table.rows or the a:tr
    elements, and cells come from table.cell(r, c).
  rubric:
    - { point: "shape.has_table → shape.table (recurse into groups)", score: 1 }
    - { point: "identify by header/cell text and assert a unique match", score: 1 }

- id: pptx-locate-02
  difficulty: hard
  weight: 2
  tags: [table-locate, pptx-model]
  question: >
    In a pptx table the Total label spans the first two columns. How is a
    merge represented, and what must you watch when editing or deleting
    cells around it?
  answer: >
    Every row still has one a:tc per grid column. The merge origin carries
    gridSpan="2" (rowSpan for vertical merges), and the covered cells carry
    hMerge="1" (or vMerge="1") and are hidden. python-pptx shows this as
    cell.is_merge_origin and cell.is_spanned. Write text only to the origin.
    When you delete or insert a column or row inside a merge, adjust
    gridSpan/rowSpan and the covered cells, or the table renders wrongly or
    is invalid.
  rubric:
    - { point: "one a:tc per column; origin gridSpan/rowSpan, covered cells hMerge/vMerge", score: 1 }
    - { point: "edit the origin; fix spans when inserting/deleting through a merge", score: 1 }

# ---------------------------------------------------------------- row-delete

- id: pptx-rowdel-01
  difficulty: easy
  weight: 3
  tags: [row-delete]
  question: >
    How do you delete a row from a pptx table with python-pptx? Is there a
    table.rows.remove() or a delete API?
  answer: >
    No. python-pptx has no API for deleting (or adding) rows or columns;
    table.rows only reads. Remove the XML element: `tbl = table._tbl;
    tbl.remove(tbl.tr_lst[i])`. The rows below move up automatically. Then
    fix the frame height and update any total.
  rubric:
    - { point: "no delete API; remove the a:tr from table._tbl", score: 1 }
    - { point: "then fix frame height and totals", score: 1 }
    - { partial: "invents rows.remove()/delete_row()", score: 0 }

- id: pptx-rowdel-02
  difficulty: medium
  weight: 3
  tags: [row-delete, table-relayout]
  question: >
    After removing an a:tr from a table, the graphicFrame's height (p:xfrm
    ext cy) is unchanged. Does that matter, and how do you fix it?
  answer: >
    Yes. The frame height no longer equals the sum of the row heights, so the
    selection box and layout are stale, and some renderers stretch or offset
    rows. python-pptx updates the frame only when you set row.height or
    column.width through its API, not when you edit the XML. Set
    graphic_frame.height = sum(row.height for row in table.rows), or re-set
    one row's height to trigger the update.
  rubric:
    - { point: "frame cy stays at the old total; not auto-updated on XML removal", score: 1 }
    - { point: "set graphic frame height = sum of row heights", score: 1 }

- id: pptx-rowdel-03
  difficulty: medium
  weight: 2
  tags: [row-delete, cell-edit]
  question: >
    The table alternates row shading. After deleting a middle row, two
    adjacent rows have the same colour. Why might that happen in one deck
    and not another?
  answer: >
    With a table style and horz_banding (a:tblPr bandRow="1"), banding is
    computed at render time and re-alternates by itself after a delete. If
    the shading is explicit per cell (a:tcPr/a:solidFill), each row keeps its
    colour, and deleting one breaks the alternation. In that case reassign
    the fills of the rows after the deleted one, or clear the explicit
    fills and rely on the style's banding.
  rubric:
    - { point: "style banding (bandRow) recomputes; explicit tcPr fills do not", score: 1 }
    - { point: "re-apply fills to the following rows (or switch to style banding)", score: 1 }

- id: pptx-rowdel-04
  difficulty: medium
  weight: 2
  tags: [row-delete, verify-safety]
  question: >
    Instead of deleting a row, someone drags a white rectangle over it, or
    sets the row's text to white and its height to near zero. Why is that
    wrong?
  answer: >
    The row and its text are still in slideN.xml. They are extractable and
    searchable, and show up in exported PDFs, accessibility readers and
    search. PowerPoint also grows a row to fit its text, so a "zero-height"
    row does not stay invisible. Remove the a:tr, fix the frame height, and
    verify by re-opening and checking that the old text is absent from
    every slide XML part.
  rubric:
    - { point: "text remains in the XML (extractable); rows grow to fit text", score: 1 }
    - { point: "remove a:tr; verify absence in all slide parts", score: 1 }

# ---------------------------------------------------------------- cell-edit

- id: pptx-cell-01
  difficulty: easy
  weight: 3
  tags: [cell-edit]
  question: >
    A header cell has bold 14 pt white text. What happens to its formatting
    when you do `cell.text = "SKU"` in python-pptx, and how do you keep it?
  answer: >
    cell.text replaces the text frame's contents with a new run that has no
    explicit run properties, so bold, size and colour set on the old run
    (a:rPr) are lost and the text falls back to the table style or defaults.
    Keep the formatting by setting the text of the first existing run
    (cell.text_frame.paragraphs[0].runs[0].text = "SKU") and removing any
    extra runs, or by copying the old a:rPr onto the new run.
  rubric:
    - { point: "cell.text drops explicit run formatting", score: 1 }
    - { point: "edit the first run's text / copy rPr", score: 1 }
    - { partial: "says cell.text keeps formatting", score: 0 }

- id: pptx-cell-02
  difficulty: medium
  weight: 2
  tags: [cell-edit, table-relayout]
  question: >
    You replace "Gadget D" with a much longer product name in a cell. What
    happens to the table's layout in PowerPoint, and how do you control it?
  answer: >
    PowerPoint wraps the text and GROWS the row height to fit (a:tr h is a
    minimum). The table gets taller and can run off the bottom of the slide
    or overlap shapes below it. python-pptx does not compute that growth.
    Estimate the width the text needs, then widen the column (and shrink
    others to stay within the slide), use a smaller font in that cell, or
    shorten the text after asking. Afterwards, check the frame's bottom
    against the slide height and the shapes below.
  rubric:
    - { point: "row grows to fit wrapped text (h is a minimum) → overflow/overlap", score: 1 }
    - { point: "measure/adjust widths or font; check the bottom vs slide and neighbours", score: 1 }

- id: pptx-cell-03
  difficulty: medium
  weight: 2
  tags: [cell-edit]
  question: >
    You change one line item's Qty from 5 to 12. What else must you update in
    the deck?
  answer: >
    Update the row's Amount and the Total (and any subtotal or tax). Also
    update every other place the total is repeated: a summary slide, a chart
    that uses the data (its embedded workbook and the cached values), and
    the speaker notes. Compute from the data, and keep the number format and
    alignment of each cell's runs.
  rubric:
    - { point: "row amount + total recomputed", score: 1 }
    - { point: "other occurrences (summary slide, chart data, notes); keep format", score: 1 }

# ---------------------------------------------------------------- table-relayout

- id: pptx-relayout-01
  difficulty: medium
  weight: 3
  tags: [table-relayout]
  question: >
    Add a row after "Service G" and before the Total row of a pptx table,
    keeping the formatting. How?
  answer: >
    There is no add_row API. Deep-copy a suitable body a:tr
    (copy.deepcopy), insert it with ref_tr.addnext(new_tr) before the Total,
    and set each cell's text through its existing first run so the
    formatting is kept. Then update the Total, set the frame height to the
    sum of the row heights, and check that the frame's new bottom stays on
    the slide and does not overlap shapes below it (move them or ask). Keep
    any explicit banding fills alternating.
  rubric:
    - { point: "deepcopy an a:tr and insert with addnext at the right position", score: 1 }
    - { point: "fill via existing runs; update total + frame height", score: 1 }
    - { point: "check the bottom vs slide/neighbour shapes (and banding)", score: 1 }

- id: pptx-relayout-02
  difficulty: hard
  weight: 3
  tags: [table-relayout]
  question: >
    Add a "SKU" column after the Item column in a pptx table that already
    spans nearly the whole slide width. What XML changes are required, and
    how do you keep the table on the slide?
  answer: >
    Insert a new a:gridCol after the Item column's gridCol in a:tblGrid, and
    in EVERY a:tr insert a new a:tc after the Item cell. Deep-copy the
    neighbouring cell so the header keeps its style (fill, bold white text)
    and body cells keep theirs, then set the text. Watch gridSpan cells such
    as a merged Total. The frame then gets wider, so shrink the column widths
    until their sum is at most the available width (within the original
    frame, or slide_width minus the margins), and set the frame width to that
    sum. Columns can shrink until their widest text no longer fits, so check
    wrapping.
  rubric:
    - { point: "new a:gridCol + one a:tc in every row at the right index (mind spans)", score: 1 }
    - { point: "copy header/body cell formatting for the new cells", score: 1 }
    - { point: "rebalance widths so the sum fits the slide/frame; update frame width", score: 1 }

# ---------------------------------------------------------------- table-insert

- id: pptx-tblins-01
  difficulty: medium
  weight: 3
  tags: [table-insert]
  question: >
    Insert a new 3×2 table on an existing slide without overlapping existing
    content. How do you pick the position and create it with python-pptx?
  answer: >
    Collect the bounding boxes (left, top, width, height) of all shapes on the
    slide. Include placeholders that hold content, and be aware of layout
    decorations. Find a free rectangle that is large enough inside the slide
    (prs.slide_width/height, minus the margins). Then call
    slide.shapes.add_table(rows, cols, left, top, width, height). It returns
    a GraphicFrame; use .table to fill the cells. If no space is free, ask,
    or propose a new slide or making room.
  rubric:
    - { point: "compute free space from existing shape bboxes within slide size", score: 1 }
    - { point: "shapes.add_table(rows, cols, left, top, width, height) → frame.table", score: 1 }

- id: pptx-tblins-02
  difficulty: medium
  weight: 2
  tags: [table-insert]
  question: >
    A table added with `add_table` looks different from the deck's existing
    tables (a blue default style). How do you make it match?
  answer: >
    add_table applies python-pptx's default table style GUID
    (a:tableStyleId, Medium Style 2 – Accent 1) with the first-row and
    banding flags on. Copy the existing table's a:tblPr: its tableStyleId
    and its firstRow/bandRow flags. If the existing table uses explicit cell
    fills or fonts, copy those too (tcPr fills, run properties). Match
    the column widths and row heights.
  rubric:
    - { point: "style comes from a:tableStyleId + tblPr flags (default = Medium Style 2)", score: 1 }
    - { point: "copy the existing table's tblPr / explicit fills & run props", score: 1 }

- id: pptx-tblins-03
  difficulty: medium
  weight: 1
  tags: [table-insert, pptx-model]
  question: >
    The slide layout has an empty content placeholder where the table should
    go. What is the idiomatic way to put a table there?
  answer: >
    Use the placeholder: a table placeholder has insert_table(rows, cols),
    which returns a PlaceholderGraphicFrame at the placeholder's position.
    A generic content placeholder may not offer it, since only a
    TablePlaceholder does. In that case add the table at the placeholder's
    left, top and width, then remove the empty placeholder element so no
    "Click to add text" box is left behind.
  rubric:
    - { point: "TablePlaceholder.insert_table(rows, cols) uses the placeholder geometry", score: 1 }
    - { point: "otherwise add at placeholder bbox and remove the empty placeholder", score: 1 }

# ---------------------------------------------------------------- image-replace

- id: pptx-imgrep-01
  difficulty: medium
  weight: 3
  tags: [image-replace]
  question: >
    python-pptx has no picture.replace(). How do you replace one picture on a
    slide with a new image file at the same position and size, and keep its
    stacking order?
  answer: >
    Add the new picture with slide.shapes.add_picture(path, left, top,
    width, height), using the old picture's geometry (or fitting the new
    aspect inside that box). add_picture appends the shape at the TOP of the
    z-order, so move its element to the old picture's position with
    old_el.addnext(new_el). Then remove the old p:pic element and drop its
    image relationship if nothing else uses that rId. An alternative is to
    add the new image part and repoint the old pic's a:blip r:embed. That
    keeps the crop (a:srcRect) and the size, but may distort an image with
    a different aspect ratio.
  rubric:
    - { point: "add_picture with old geometry (aspect-aware) or repoint blip r:embed", score: 1 }
    - { point: "restore z-order (addnext next to old element) and remove the old p:pic", score: 1 }
    - { point: "drop the old image rel if unused", score: 1 }

- id: pptx-imgrep-02
  difficulty: hard
  weight: 2
  tags: [image-replace]
  question: >
    To replace a logo you overwrite the picture's image-part bytes. The logo
    on slide 1 changes, but so does the one on slide 7, which should have
    stayed. Why?
  answer: >
    python-pptx deduplicates image parts by SHA1, and several pictures,
    on the same slide or other slides, can reference one image part.
    Overwriting the part's blob changes every picture that uses it. Replace
    only the intended picture by giving it a new part (add_picture, or
    repoint its r:embed to a newly added image part). Check first which
    shapes and parts reference the old image.
  rubric:
    - { point: "image parts are shared across pictures/slides (SHA1 dedupe)", score: 1 }
    - { point: "give the target picture its own new image part", score: 1 }

- id: pptx-imgrep-03
  difficulty: hard
  weight: 2
  tags: [image-replace, verify-safety]
  question: >
    After removing an old picture you call `slide.part.drop_rel(rId)` to get
    its image out of the file. Another picture on the same slide used the
    same image and is now broken. Why did python-pptx drop a relationship
    that was still in use?
  answer: >
    drop_rel removes the relationship when its reference count is under 2,
    but the count only looks for r:id attributes in the part's XML. Pictures
    reference images with a:blip r:embed, so an image rel always counts as 0
    and is always dropped. Before dropping it, check yourself that no other
    element in the part refers to the rId (xpath //@r:embed and //@r:link
    equal to rId).
  rubric:
    - { point: "drop_rel's ref count only sees r:id, not a:blip r:embed → always drops image rels", score: 1 }
    - { point: "check //@r:embed (and r:link) for other users before dropping", score: 1 }
    - { partial: "says shared images must not be dropped without explaining why drop_rel did it", score: 0.5 }

# ---------------------------------------------------------------- image-insert

- id: pptx-imgins-01
  difficulty: easy
  weight: 3
  tags: [image-insert]
  question: >
    Insert signature.png 2 inches wide at the bottom-right of a slide,
    keeping its aspect ratio, without covering existing content. How?
  answer: >
    Call slide.shapes.add_picture(path, left, top, width=Inches(2)). With
    only width given, the height follows the image's aspect ratio (give both
    and it is stretched). Compute left = right edge − width, taken from the
    slide width minus the margin, or from the right edge of the content it
    should align with. Compute top from the bottom limit minus the height.
    Then check the resulting box against every existing shape's bbox and
    move it if they overlap.
  rubric:
    - { point: "add_picture with width only keeps aspect (both = stretch)", score: 1 }
    - { point: "position from slide/content edges and check overlap with shape bboxes", score: 1 }

- id: pptx-imgins-02
  difficulty: medium
  weight: 2
  tags: [image-insert]
  question: >
    You insert a portrait photo into a picture placeholder with
    `placeholder.insert_picture(path)`. Part of the photo disappears. Why?
  answer: >
    insert_picture fits the image to the placeholder's size and aspect by
    CROPPING (it sets the crop so the picture fills the placeholder). A
    portrait image in a landscape placeholder loses its top and bottom. To
    show the whole image, adjust crop_top, crop_bottom, crop_left and
    crop_right back to 0 and resize the shape to the image's aspect, or use
    add_picture with width or height only.
  rubric:
    - { point: "insert_picture crops to fill the placeholder aspect", score: 1 }
    - { point: "reset crop + resize, or use add_picture with one dimension", score: 1 }

# ---------------------------------------------------------------- legacy-ppt

- id: pptx-legacy-01
  difficulty: easy
  weight: 3
  tags: [legacy-ppt]
  question: >
    The user gives you deck.ppt (PowerPoint 97–2003) and asks you to change a
    table. Can python-pptx open it? What is the workflow?
  answer: >
    No. .ppt is the binary OLE2 compound-file format, and python-pptx opens
    only OOXML ZIP packages. It raises PackageNotFoundError / not-a-zip, and
    renaming the file doesn't help. Convert with LibreOffice headless
    (soffice --headless --convert-to pptx --outdir out deck.ppt), edit the
    .pptx, and convert back to .ppt only if the user needs that format. Keep
    the original, and check the converted slides (tables, images, fonts)
    before editing.
  rubric:
    - { point: ".ppt is binary OLE2; python-pptx can't open it", score: 1 }
    - { point: "LibreOffice headless convert → pptx, edit, convert back if required", score: 1 }

- id: pptx-legacy-02
  difficulty: medium
  weight: 2
  tags: [legacy-ppt, verify-safety]
  question: >
    After converting a .ppt to .pptx with LibreOffice, what should you check
    before and after editing, and what must you tell the user?
  answer: >
    Conversion is not lossless. Tables, fonts, animations, embedded OLE
    objects and exact positions can change. Before editing, compare the
    converted deck with the original: slide count, the tables with their
    rows and cells, the images, and ideally rendered previews. After
    editing, check again. Tell the user the file went through a conversion,
    and deliver the format they asked for (.ppt back if required), keeping
    the untouched original.
  rubric:
    - { point: "conversion can alter content/layout; verify counts/tables/images (render)", score: 1 }
    - { point: "tell the user; keep original; return requested format", score: 1 }

# ---------------------------------------------------------------- verify-safety

- id: pptx-verify-01
  difficulty: easy
  weight: 3
  tags: [verify-safety]
  question: >
    What is the safe save-and-verify procedure after editing deck.pptx with
    a script?
  answer: >
    Keep the original untouched and save to a new file. Re-open the output
    with python-pptx. Assert the intended change: the exact table cell texts
    and their order, totals, and frame geometry within the slide. Assert
    that the other slides and shapes are unchanged, for example by comparing
    their XML or text with the original. Search every slide part for text
    that should be gone. Render the slide to an image (LibreOffice or Quick
    Look) for a visual check when possible.
  rubric:
    - { point: "new output file; original untouched", score: 1 }
    - { point: "re-open and assert exact content + unchanged remainder (render if possible)", score: 1 }

- id: pptx-verify-02
  difficulty: medium
  weight: 2
  tags: [verify-safety, pptx-model]
  question: >
    After XML edits to a table, PowerPoint says the file "needs to be
    repaired". Name common causes.
  answer: >
    Common causes:
    - a row with a different number of a:tc than there are gridCols;
    - an a:tc without a:txBody (or a txBody without an a:p);
    - broken merge attributes (gridSpan/hMerge that don't add up);
    - elements out of schema order;
    - duplicate shape ids (p:cNvPr id) after copying shapes;
    - an r:embed pointing to a dropped relationship.
    python-pptx does not validate these.
  rubric:
    - { point: "tc count vs gridCol mismatch / tc without txBody / broken spans", score: 1 }
    - { point: "duplicate cNvPr ids, dangling rIds, schema order; no validation by python-pptx", score: 1 }
    - { partial: "only 'check the XML is well-formed'", score: 0.5 }

- id: pptx-verify-03
  difficulty: medium
  weight: 2
  tags: [verify-safety, image-replace]
  question: >
    You removed a confidential image from a slide by deleting its p:pic
    element. Is it gone from the .pptx? How do you check?
  answer: >
    Not necessarily. The slide's relationship to the image part survives,
    and python-pptx saves every part reachable through rels, so
    ppt/media/imageN.* stays in the zip. The image may also be used by other
    slides, a layout, or notes. Drop the rel when nothing else in that part
    uses it (checking r:embed yourself). Then list the saved zip and
    confirm that no media entry still has the old bytes (hash compare).
  rubric:
    - { point: "deleting p:pic leaves rel + media in the zip", score: 1 }
    - { point: "drop unused rel; verify by listing/hashing zip media", score: 1 }
