stack: pdf
title: PDF editing (existing documents — tables, images; Python, PyMuPDF-centric)
corpus_rev: 1
# Derivation + validation threshold for this stack (rubric-guide.md default is 0.75).
threshold: 0.9
# Version scope: PyMuPDF >= 1.24 (import name `pymupdf`; `fitz` is the legacy
# alias), pdfplumber, pikepdf, pypdf 4+. Answers are graded on technique, not on
# one library: an equivalent correct approach in another tool earns the point.
# Key API facts in the answer key were verified against PyMuPDF 1.27.1.
version_scope: "pymupdf>=1.24"

# Tag vocabulary — each tag is a subscore axis.
tags:
  - pdf-model        # content streams, no table/row objects, glyph positioning, coordinate systems
  - table-locate     # find the table, rows, cells and their geometry
  - row-delete       # remove a row and close the gap, recompute totals
  - cell-edit        # replace a cell's text in place (remove, measure, align, style match)
  - table-relayout   # add a row / add a column: shift content, width budget, page overflow
  - table-insert     # draw a new table into free space
  - image-replace    # swap an existing image
  - image-insert     # place a new image
  - fonts            # base-14 vs embedded/subset fonts, glyph coverage, style matching
  - verify-safety    # prove the edit on the text layer, keep the original, real removal

# Universal: the skill gate does NOT use marker detection for this corpus. These
# tuning skills are admitted on the exact model id alone (internal/skill
# universalStacks -> stackActive), for the same reason as conduct/ and
# hallucination/ — but unlike those two, pdf is a real document format, so the
# reason is a concrete detection gap rather than "not a stack at all":
#
#   * generate a PDF from scratch — no .pdf exists yet, so the marker is absent;
#   * a PDF attached/streamed from outside the repo — marker globs only see disk;
#   * a PDF deeper than the glob limit (stackdetect uses filepath.Glob, no "**");
#   * the session that FIRST writes the PDF, because the prompt context is built
#     once and cached for prefix stability before the request exists.
#
# All four produced a create/edit PDF task running with no catalogue line and no
# digest, so the model had no way to learn these corrections existed.
#
# `markers` below are retained as INFORMATION ONLY: internal/stackdetect still
# reports `pdf` (other consumers may read Detect output), but the skill gate
# ignores it. Nothing in docs/okf/_tools/ derives stackdetect from this file, so
# mode and markers cannot drift out of sync silently in either direction.
detection:
  mode: universal
  # Informational: what stackdetect still globs for (depth-limited; filepath.Glob
  # has no "**"). NOT a gate for these skills.
  markers:
    - { type: file, glob: "*.pdf" }
    - { type: file, glob: "*/*.pdf" }
    - { type: file, glob: "*/*/*.pdf" }
